950 495 970 495" stroke="#000000" stroke-width="1.3" fill="none"/><polyline points="954 499 966 499" stroke="#000000" stroke-width="1.3" fill="none"/><polyline points="958 503 962 503" stroke="#000000" stroke-width="1.3" fill="none"/><polyline points="760 370 875 370" stroke="#008800" stroke-width="1.3" fill="none"/><text x="763" y="365" font-size="10.8" fill="#0000FF" font-family="Arial" text-anchor="start">LED_CTL</text><polyline points="875 370 910 370" stroke="#008800" stroke-width="1.3" fill="none"/><polyline points="875 370 875 405" stroke="#008800" stroke-width="1.3" fill="none"/><circle cx="875" cy="370" r="2.5" fill="#008800"/><polyline points="875 465 875 495" stroke="#008800" stroke-width="1.3" fill="none"/><text x="878" y="490" font-size="10.8" fill="#0000FF" font-family="Arial" text-anchor="start">GND</text><polyline points="865 495 885 495" stroke="#000000" stroke-width="1.3" fill="none"/><polyline points="869 499 881 499" stroke="#000000" stroke-width="1.3" fill="none"/><polyline points="873 503 877 503" stroke="#000000" stroke-width="1.3" fill="none"/><text x="60" y="555" font-size="13.2" fill="#000080" font-family="Arial" text-anchor="start">Grove cable: 1 yellow = BTN_N | 2 white = LED_CTL | 3 red = 3.3 V | 4 black = GND</text><text x="60" y="580" font-size="12.0" fill="#000080" font-family="Arial" text-anchor="start">Button is active LOW (pressed = LOW). LED_CTL HIGH lights D1; R6 100K keeps Q1 off while the MCU pin floats.</text><text x="60" y="603" font-size="12.0" fill="#000080" font-family="Arial" text-anchor="start">Q1 BSS138: pin 1 gate, pin 2 source, pin 3 drain. LED current is about (3.3 V - 2.0 V) / 4K7 = 0.28 mA.</text><text x="60" y="626" font-size="12.0" fill="#000080" font-family="Arial" text-anchor="start">C3 0.1uF is the Grove port supply decoupling, as on the Maker Pi Grove ports. 3.3 V supply and signals only.</text><text x="60" y="649" font-size="10.799999999999999" fill="#000080" font-family="Arial" text-anchor="start">References: Maker Pi RP2040 sheets 2-3 (buttons, Grove ports, IO status LEDs); Maker Pi Pico sheets 1-2.</text><text x="60" y="671" font-size="10.799999999999999" fill="#000080" font-family="Arial" text-anchor="start">Values follow the Cytron references (10K / 1K / 0.1uF button, LED + 4K7 + BSS138) except R6: 100K instead of 3M3.</text><text x="60" y="692" font-size="10.799999999999999" fill="#000080" font-family="Arial" text-anchor="start">Grove pin order above is explicit (Cytron symbols number differently). SW2 uses switch pins 1 and 3; pads 2 and 4 unmapped - verify 1 and 3 are opposite contacts before wiring.</text></svg>