10K pull-up gives the idle level. R2 1K is in series with the switch; C1 0.1uF is across the switch.</text><text x="60" y="603" font-size="12.0" fill="#000080" font-family="Arial" text-anchor="start">Same network as Maker Pi RP2040 sheet 2 PUSH BUTTONS (R19 10K, R20 1K, S3, C26 0.1uF).</text><text x="60" y="626" font-size="12.0" fill="#000080" font-family="Arial" text-anchor="start">J2 accepts a dry-contact switch in parallel with SW1. Configure the MCU pin as an input.</text><text x="60" y="649" font-size="10.799999999999999" fill="#000080" font-family="Arial" text-anchor="start">References: Maker Pi RP2040 sheet 2; Maker Pi Pico sheet 1; ETT ET-ESP32 LAB V1 input switch block.</text><text x="60" y="671" font-size="10.799999999999999" fill="#000080" font-family="Arial" text-anchor="start">Added to the reference: J1 header, optional J2. 3.3 V only. SW1 uses switch pins 1 and 3; pads 2 and 4 unmapped - verify 1 and 3 are opposite contacts before wiring.</text></svg>